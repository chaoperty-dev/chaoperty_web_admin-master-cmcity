  <script src="https://unpkg.com/tesseract.js@v4.0.2/dist/tesseract.min.js" defer crossorigin="anonymous"></script>
  <script defer>
    // ✅ OCR core (เหมือนเดิม)
    const LANG_BASES = [
      "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main",
      "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main",
      "https://tesseract.projectnaptha.com/4.0.0",
    ];

    function preferredBaseIndex(firstLang) {
      // ตอนนี้ใช้ best เป็นค่าเริ่มต้นเสมอ
      return 0;
    }

    const OCR = (() => {
      let worker = null;
      let currentBaseIdx = null;
      let initializedLangs = null;

      const queue = [];
      let processing = false;

      async function createWorkerAt(baseIdx) {
        return await Tesseract.createWorker({
          langPath: LANG_BASES[baseIdx],
        });
      }

      async function ensureWorkerForLangs(langs) {
        const startIdx = currentBaseIdx ?? preferredBaseIndex(langs.split('+')[0]);

        if (!worker || initializedLangs !== langs) {
          if (worker) {
            try { await worker.terminate(); } catch (_) { }
            worker = null;
          }

          const candidates = [startIdx, ...[0, 1, 2].filter(i => i !== startIdx)];

          for (const idx of candidates) {
            try {
              const w = await createWorkerAt(idx);
              await w.loadLanguage(langs);
              await w.initialize(langs);
              worker = w;
              currentBaseIdx = idx;
              initializedLangs = langs;
              return worker;
            } catch (_) {
              try { await worker?.terminate(); } catch (_) { }
              worker = null;
              initializedLangs = null;
            }
          }

          throw new Error("Cannot load traineddata for: " + langs);
        }

        return worker;
      }

      async function runJob(imagePath, mapData = {}) {
        const langs = (mapData.language || "eng").trim();
        const args = mapData.args || {};

        const w = await ensureWorkerForLangs(langs);
        if (Object.keys(args).length) {
          await w.setParameters(args);
        }

        const result = await w.recognize(imagePath);
        return args["tessjs_create_hocr"] ? result.data.hocr : result.data.text;
      }

      async function processQueue() {
        if (processing) return;
        processing = true;

        while (queue.length) {
          const { imagePath, mapData, resolve, reject } = queue.shift();
          try {
            const out = await runJob(imagePath, mapData);
            resolve(out);
          } catch (e) {
            reject(e);
          }
        }

        processing = false;
      }

      function push(imagePath, mapData) {
        if (mapData && typeof mapData.logger !== 'function') {
          delete mapData.logger;
        }

        return new Promise((resolve, reject) => {
          queue.push({ imagePath, mapData, resolve, reject });
          processQueue();
        });
      }

      async function terminate() {
        if (worker) {
          try { await worker.terminate(); } catch (_) { }
        }
        worker = null;
        initializedLangs = null;
        currentBaseIdx = null;
      }

      return { push, terminate };
    })();

    // ฟังก์ชันที่ Flutter Web เรียกผ่าน JS interop
    async function __extractCore(imagePath, mapData = {}) {
      return OCR.push(imagePath, mapData);
    }
    window.extractText = __extractCore;
    window._extractText = __extractCore;
    window.__terminateOcrWorker = () => OCR.terminate();

    // คืน “คำ + พิกัด” สำหรับ overlay โดยใช้ worker แยก
    async function __extractWords(imagePath, mapData = {}) {
      const langs = (mapData.language || "eng").trim();
      const args = mapData.args || {};
      const w = await Tesseract.createWorker({
        langPath: LANG_BASES[0],
      });

      try {
        await w.loadLanguage(langs);
        await w.initialize(langs);
        if (Object.keys(args).length) {
          await w.setParameters(args);
        }
        const { data } = await w.recognize(imagePath);

        return data.words.map((x) => ({
          text: x.text,
          x: x.bbox.x0,
          y: x.bbox.y0,
          w: x.bbox.x1 - x.bbox.x0,
          h: x.bbox.y1 - x.bbox.y0,
          conf: x.confidence,
        }));
      } finally {
        await w.terminate();
      }
    }
    window._extractWords = __extractWords;
  </script>
  <style>
    .loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #ffffff 0%, #f9fafb 100%);
      z-index: 9999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loader-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100px;
      height: 100px;
    }

    .loader-ring {
      position: absolute;
      width: 80px;
      height: 80px;
      border: 4px solid transparent;
      border-top-color: #7f4caf;
      border-radius: 50%;
      animation: spin-ios 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 15px rgba(76, 175, 80, 0.1);
    }

    .loader-ring:nth-child(2) {
      width: 60px;
      height: 60px;
      border-top-color: #c781c1;
      animation-direction: reverse;
      animation-duration: 0.8s;
      opacity: 0.7;
    }

    @keyframes spin-ios {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      margin-top: 32px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #7a2e7d;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0;
      animation: fade-in-text 1s ease forwards 0.3s;
    }

    @keyframes fade-in-text {
      to {
        opacity: 0.8;
      }
    }
  </style>
