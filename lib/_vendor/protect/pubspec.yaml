name: protect
description: Protect encrypts/decrypt your excel files with password.
# 🔧 LOCAL FORK — see lib/_vendor/protect/README.md
# - spinCount reduced from 100000 → 10000 (Office Open XML PBKDF2 iterations)
# - Reason: pure-Dart SHA-512 in JS = ~30s for 9KB on web (compute() no help)
# - 10K iterations: ~3s on web, format-compatible with Excel password-protected xlsx
version: 1.0.0-local.1
homepage: https://github.com/justkawal/protect

environment:
  # 🔧 PATCHED: removed upper bound to allow Dart 3.x SDK (project uses >=3.0.5)
  # Original was `>=2.16.0 <3.0.0` — incompatible with the app's Dart 3 toolchain
  # and triggered "language version override has to be the same in the library and its part(s)"
  # because the package was being compiled against Dart 3 with a Dart 2 SDK constraint.
  sdk: ">=2.16.0 <4.0.0"

dependencies:
  xml_parser: ^1.0.0
  crypto: ^3.0.1
  # ⚠️ KEEPING ^2.0.2 (Dart 2.x SDK constraint) — the project's Dart SDK is 3.0.5,
  # but aes_crypt_null_safe 3.x requires SDK >=3.3.0. Compilation still works because:
  # - aes_crypt_null_safe 2.0.2 is loaded with its own languageVersion 2.12 from package_config
  # - Our fork forces // @dart=3.0 on its own files
  # - Dart 3.10 compiler accepts mixing language versions across packages
  aes_crypt_null_safe: ^2.0.2

dev_dependencies:
  flutter_lints: ^1.0.4
